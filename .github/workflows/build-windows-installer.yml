# Build Windows Installer
#
# Compiles the Inno Setup installer for Unify Desktop Assistant.
# Manually triggered. Choose environment (main/staging) and version.
# Publishes the .exe to a GitHub Release.

name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment (bakes in API URLs)'
        required: true
        type: choice
        options:
          - main
          - staging
        default: main
      version:
        description: 'Version (e.g. 1.2.0). Leave empty to use default from setup.iss.'
        required: false
        type: string

concurrency:
  group: build-windows-installer-${{ inputs.environment }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          # Use HASHTABLE splatting, not an array. Array splatting passes elements
          # positionally, so '-Clean'/'-Staging' would NOT bind to the switches --
          # '-Clean' lands in build.ps1's first positional param (-Version) and
          # -Staging is dropped, silently producing a mislabeled production build.
          $buildArgs = @{ Clean = $true }

          # Determine environment.
          # IMPORTANT: do NOT name this variable $env. $env is PowerShell's reserved
          # environment-variable drive; assigning to it does not round-trip, so the
          # comparison below would silently fail.
          $environment = "${{ inputs.environment }}"
          if ($environment -eq 'staging') {
            $buildArgs['Staging'] = $true
            Write-Host "Building for STAGING environment"
          } else {
            Write-Host "Building for PRODUCTION environment"
          }

          # Optional version override
          $version = "${{ inputs.version }}"
          if ($version -ne '') {
            $buildArgs['Version'] = $version
            Write-Host "Version override: $version"
          }

          Write-Host "Running build.ps1 with: $(($buildArgs.GetEnumerator() | ForEach-Object { "-$($_.Key) $($_.Value)" }) -join ' ')"
          & .\windows\installer\build.ps1 @buildArgs

      - name: Verify, version & rename installer
        id: version
        shell: pwsh
        run: |
          $environment = "${{ inputs.environment }}"

          $exe = Get-ChildItem windows/installer/output/*.exe | Select-Object -First 1
          if (-not $exe) { throw "No installer was produced by build.ps1" }
          Write-Host "Compiled artifact: $($exe.Name)"

          # The compiled OutputBaseFilename carries the -staging suffix only when the
          # installer was actually built for staging, so treat it as the source of
          # truth. Fail loudly if it disagrees with the requested environment -- this
          # catches the class of bug where the staging flag is silently dropped and a
          # production binary would otherwise be published under the staging name.
          $isStagingBuild = $exe.Name -like '*-staging.exe'
          if ($environment -eq 'staging' -and -not $isStagingBuild) {
            throw "Requested 'staging' but compiled '$($exe.Name)' has no -staging suffix => PRODUCTION was built. Aborting."
          }
          if ($environment -ne 'staging' -and $isStagingBuild) {
            throw "Requested 'main' but compiled '$($exe.Name)' has a -staging suffix => STAGING was built. Aborting."
          }

          # Defense in depth: the staging backend host is baked in only for staging
          # builds. (The production host is always present via the GUI fallback, so
          # we key off the staging host's presence/absence instead.)
          $hasStagingHost = [bool](Select-String -Path $exe.FullName -Pattern 'internal.example.com' -SimpleMatch -Quiet)
          if ($environment -eq 'staging' -and -not $hasStagingHost) {
            throw "Staging build does not contain the staging backend host. Aborting."
          }
          if ($environment -ne 'staging' -and $hasStagingHost) {
            throw "Production build unexpectedly contains the staging backend host. Aborting."
          }

          # Derive the version from the compiled filename so the release tag always
          # matches the binary: UnifyDesktopAssistant-Setup-<ver>[-staging].exe
          if ($exe.Name -match '^UnifyDesktopAssistant-Setup-(.+?)(-staging)?\.exe$') {
            $version = $Matches[1]
          } else {
            throw "Could not parse version from compiled filename '$($exe.Name)'"
          }
          $tag = "v$version"
          Write-Host "Version: $version, Tag: $tag"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

          # Publish under a stable, frontend-friendly name.
          if ($environment -eq 'staging') {
            $dest = 'windows/installer/output/unify-desktop-assistant-staging.exe'
          } else {
            $dest = 'windows/installer/output/unify-desktop-assistant.exe'
          }
          Move-Item $exe.FullName $dest -Force
          "asset=$dest" >> $env:GITHUB_OUTPUT
          Write-Host "Renamed -> $dest"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Unify Desktop Assistant ${{ steps.version.outputs.version }}
          files: ${{ steps.version.outputs.asset }}
          prerelease: ${{ inputs.environment == 'staging' }}
          generate_release_notes: false
