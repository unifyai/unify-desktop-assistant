# Build Windows Installer
#
# Compiles the Inno Setup installer for Unify Desktop Assistant.
# Manually triggered. Choose environment (main/staging) and version.
# Publishes the .exe to a GitHub Release.

name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment (bakes in API URLs)'
        required: true
        type: choice
        options:
          - main
          - staging
        default: main
      version:
        description: 'Version (e.g. 1.2.0). Leave empty to use default from setup.iss.'
        required: false
        type: string

concurrency:
  group: build-windows-installer-${{ inputs.environment }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $buildArgs = @('-Clean')

          # Determine environment
          $env = "${{ inputs.environment }}"
          if ($env -eq 'staging') {
            $buildArgs += '-Staging'
            Write-Host "Building for STAGING environment"
          } else {
            Write-Host "Building for PRODUCTION environment"
          }

          # Optional version override
          $version = "${{ inputs.version }}"
          if ($version -ne '') {
            $buildArgs += "-Version"
            $buildArgs += $version
            Write-Host "Version override: $version"
          }

          Write-Host "Running: .\windows\installer\build.ps1 $($buildArgs -join ' ')"
          & .\windows\installer\build.ps1 @buildArgs

      - name: Determine version tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if ($version -eq '') {
            $issContent = Get-Content windows/installer/setup.iss -Raw
            if ($issContent -match '#define MyAppVersion\s+"([^"]+)"') {
              $version = $Matches[1]
            } else {
              Write-Error "Could not determine version from setup.iss"
              exit 1
            }
          }
          $tag = "v$version"
          Write-Host "Version: $version, Tag: $tag"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Rename installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem windows/installer/output/*.exe | Select-Object -First 1
          if ("${{ inputs.environment }}" -eq "staging") {
            Move-Item $exe.FullName windows/installer/output/unify-desktop-assistant-staging.exe
          } else {
            Move-Item $exe.FullName windows/installer/output/unify-desktop-assistant.exe
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Unify Desktop Assistant ${{ steps.version.outputs.version }}
          files: windows/installer/output/unify-desktop-assistant*.exe
          prerelease: ${{ inputs.environment == 'staging' }}
          generate_release_notes: false
