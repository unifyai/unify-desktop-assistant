# Build Ubuntu Installer (.deb)
#
# Assembles the .deb package for Unify Desktop Assistant.
# Manually triggered. Choose environment (main/staging) and version.
# Publishes the .deb to a GitHub Release.

name: Build Ubuntu Installer

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment (bakes in API URLs)'
        required: true
        type: choice
        options:
          - main
          - staging
        default: main
      version:
        description: 'Version (e.g. 1.2.0). Leave empty to use default from control file.'
        required: false
        type: string

concurrency:
  group: build-ubuntu-installer-${{ inputs.environment }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build .deb package
        run: |
          cd ubuntu/installer

          BUILD_ARGS=("--clean")

          ENV="${{ inputs.environment }}"
          if [ "$ENV" = "staging" ]; then
            BUILD_ARGS+=("--staging")
            echo "Building for STAGING environment"
          else
            echo "Building for PRODUCTION environment"
          fi

          VERSION="${{ inputs.version }}"
          if [ -n "$VERSION" ]; then
            BUILD_ARGS+=("--version" "$VERSION")
            echo "Version override: $VERSION"
          fi

          echo "Running: ./build.sh ${BUILD_ARGS[*]}"
          ./build.sh "${BUILD_ARGS[@]}"

      - name: Determine version tag
        id: version
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION=$(grep -oP '^Version:\s*\K.*' ubuntu/unify-desktop-assistant/DEBIAN/control)
            if [ -z "$VERSION" ]; then
              echo "::error::Could not determine version from control file"
              exit 1
            fi
          fi
          TAG="v${VERSION}"
          echo "Version: $VERSION, Tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Rename installer
        run: |
          DEB=$(ls ubuntu/installer/output/*.deb | head -1)
          if [ "${{ inputs.environment }}" = "staging" ]; then
            mv "$DEB" ubuntu/installer/output/unify-desktop-assistant-staging.deb
          else
            mv "$DEB" ubuntu/installer/output/unify-desktop-assistant.deb
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Unify Desktop Assistant ${{ steps.version.outputs.version }}
          files: ubuntu/installer/output/unify-desktop-assistant*.deb
          prerelease: ${{ inputs.environment == 'staging' }}
          generate_release_notes: false
